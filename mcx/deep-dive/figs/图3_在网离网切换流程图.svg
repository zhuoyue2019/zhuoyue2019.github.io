<text x="500.0" y="440.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">手动切换（授权用户）</text>
<text x="500.0" y="464.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">有覆盖时也可切到直通</text>
<line x1="500" y1="330" x2="500" y2="420" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="500" y="510" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="14" text-anchor="middle">恢复覆盖 → 切回在网，切换时尽量不中断通话 [§7.13]</text>
