<text x="500.0" y="34" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="18" text-anchor="middle" font-weight="bold">图3  在网 / 离网切换：有网走基站，没网终端直连</text>
<rect x="350" y="60" width="300" height="56" stroke="black" fill="white" stroke-width="2"/>
