<polygon points="500,150 650,200 500,250 350,200" stroke="black" fill="white" stroke-width="2"/>
<text x="500" y="205" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="15" text-anchor="middle">在覆盖内？</text>
<line x1="350" y1="200" x2="220" y2="200" stroke="black" stroke-width="2"/>
<line x1="220" y1="200" x2="220" y2="260" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="285" y="190" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">是</text>
