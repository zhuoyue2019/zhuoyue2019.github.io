<text x="780.0" y="287.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">离网模式（自动切换）</text>
<text x="780.0" y="311.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">ProSe 终端直通，不经过基站</text>
<text x="780" y="360" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">如深山灭火：离最近基站 20 英里</text>
<line x1="220" y1="330" x2="780" y2="330" stroke="black" stroke-width="2"/>
