<text x="220.0" y="287.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">在网模式</text>
<text x="220.0" y="311.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">终端 → 基站 → 核心网</text>
<text x="220" y="360" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">覆盖广、稳定、可跨域</text>
<line x1="650" y1="200" x2="780" y2="200" stroke="black" stroke-width="2"/>
