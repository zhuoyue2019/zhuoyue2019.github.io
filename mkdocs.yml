site_name: Alex 的知识库
site_description: 3GPP UAS、无人机通信、应急政策等知识沉淀
site_author: Alex

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 3GPP UAS:
      - 总览: 3gpp-uas/index.md
      - 关键规范清单: 3gpp-uas/specs.md
  - 应急政策:
      - 总览: emergency/index.md
      - 法律法规: emergency/laws.md
  - 关于: about.md
