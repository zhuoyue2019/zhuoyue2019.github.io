site_name: Alex 的知识库
site_description: 3GPP UAS、无人机通信、应急政策等知识沉淀
site_author: Alex

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - toc:
      permalink: true

