site_name: Alex 的知识库
site_description: 3GPP UAS、无人机通信、应急政策等知识沉淀
site_author: Alex

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 3GPP UAS:
      - 总览: 3gpp-uas/index.md
      - 关键规范清单: 3gpp-uas/specs.md
      - Rel-20 ISAC for UAV 深度报告: 3gpp-uas/isac-for-uav.md
      - 跟踪动态: 3gpp-uas/tracking.md
  - 跟踪平台:
      - 总览: tracking/index.md
      - 3GPP UAS 规范跟踪: 3gpp-uas/tracking.md
      - 低空政策跟踪: tracking/policy.md
      - MCX 规范跟踪: mcx/tracking.md
  - MCX:
      - 总览: mcx/index.md
      - 关键规范清单: mcx/specs.md
      - 逻辑架构: mcx/architecture.md
      - 3GPP vs 中国对照: mcx/comparison.md
      - 应急通信视角: mcx/emergency.md
      - 跟踪动态: mcx/tracking.md
      - 标准深入理解:
        - 总览: mcx/deep-dive/index.md
        - TS 22.280 MCCoRe 通用需求: mcx/deep-dive/22280.md
        - TS 22.179 MCPTT: mcx/deep-dive/22179.md
        - TS 22.281 MCVideo: mcx/deep-dive/22281.md
        - TS 22.282 MCData: mcx/deep-dive/22282.md
        - TS 23.280 MCX 通用功能架构: mcx/deep-dive/23280.md
        - TS 23.379 MCPTT 架构: mcx/deep-dive/23379.md
        - TS 23.281 MCVideo 架构: mcx/deep-dive/23281.md
        - TS 23.282 MCData 架构: mcx/deep-dive/23282.md
      - 问答:
        - MCPTT vs 普通对讲机: mcx/faq-mcptt-vs-intercom.md
        - MCX 与 5G 切片: mcx/faq-mcx-vs-5g-slicing.md
        - QoS 优先级保障: mcx/faq-mcx-qos-priority.md
        - MCVideo vs 视频通话: mcx/faq-mcvideo-vs-video-call.md
        - 国内应急行业现状: mcx/faq-mcx-china-emergency.md
  - 应急政策:
      - 总览: emergency/index.md
      - 法律法规: emergency/laws.md
  - 免费 API:
      - 配置手册: free-api/config.md
  - 关于: about.md
