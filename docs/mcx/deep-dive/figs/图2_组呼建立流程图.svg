<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="black"/></marker></defs>
<rect x="0" y="0" width="1000" height="700" fill="white" stroke="none"/>
<text x="500.0" y="34" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="18" text-anchor="middle" font-weight="bold">图2  组呼建立流程：先登录、再归属、然后说话</text>
<rect x="330" y="64" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="84.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">① 登录</text>
<text x="500.0" y="108.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">MCX User ID 签入</text>
<line x1="500" y1="120" x2="500" y2="148" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="148" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="168.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">② 归属到组</text>
<text x="500.0" y="192.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">Affiliation：订阅要听的组</text>
<line x1="500" y1="204" x2="500" y2="232" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="232" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="252.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">③ 选定当前组</text>
<text x="500.0" y="276.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">Selected Group（可 0 个或 1 个）</text>
<line x1="500" y1="288" x2="500" y2="316" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="316" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="336.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">④ 发起组呼</text>
<text x="500.0" y="360.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">按下 PTT，向组内发言</text>
<line x1="500" y1="372" x2="500" y2="400" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="400" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="420.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">⑤ 组员收到提示</text>
<text x="500.0" y="444.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">提示音 / 通知：组呼已建立</text>
<line x1="500" y1="456" x2="500" y2="484" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="484" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="504.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">⑥ 通话进行</text>
<text x="500.0" y="528.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">发言权按优先级分配</text>
<line x1="500" y1="540" x2="500" y2="568" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="568" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="588.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">⑦ 迟加入者接入</text>
<text x="500.0" y="612.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">中途加入者收到发言人身份与位置</text>
<rect x="40" y="148" width="250" height="56" stroke="black" fill="white" stroke-width="2" stroke-dasharray="8,5"/>
<text x="165.0" y="168.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">前提：先归属</text>
<text x="165.0" y="192.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">未归属不能参与组通信 [§5.1.5-007]</text>
<line x1="290" y1="176" x2="330" y2="176" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
</svg>
