<line x1="400" y1="194" x2="400" y2="224" stroke="#000000" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="400" y1="272" x2="400" y2="302" stroke="#000000" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="400" y1="350" x2="400" y2="380" stroke="#000000" stroke-width="1.6" marker-end="url(#arr)"/>
