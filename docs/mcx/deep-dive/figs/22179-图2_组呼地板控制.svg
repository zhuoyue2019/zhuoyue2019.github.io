<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="black"/></marker></defs>
<rect x="0" y="0" width="1000" height="600" fill="white" stroke="none"/>
<text x="500.0" y="34" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="18" text-anchor="middle" font-weight="bold">图2  组呼 + 地板控制：按讲、排队、说话、释放</text>
<rect x="330" y="64" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="84.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">① 按讲（PTT）</text>
<text x="500.0" y="108.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">用户按下说话键</text>
<line x1="500" y1="120" x2="500" y2="148" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="148" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="168.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">② 请求发言权</text>
<text x="500.0" y="192.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">向系统请求 Floor</text>
<line x1="500" y1="204" x2="500" y2="232" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="232" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="252.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">③ 系统仲裁</text>
<text x="500.0" y="276.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">有人说话？按优先级排队</text>
<line x1="500" y1="288" x2="500" y2="316" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="316" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="336.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">④ 授予 / 排队 / 拒绝</text>
<text x="500.0" y="360.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">绿灯说 / 等待 / 拒绝</text>
<line x1="500" y1="372" x2="500" y2="400" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="400" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="420.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">⑤ 说话</text>
<text x="500.0" y="444.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">获得 Floor 者发言，他人收听</text>
<line x1="500" y1="456" x2="500" y2="484" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<rect x="330" y="484" width="340" height="56" stroke="black" fill="white" stroke-width="2"/>
<text x="500.0" y="504.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">⑥ 松开释放</text>
<text x="500.0" y="528.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">Floor 释放，下一位接续</text>
<rect x="40" y="232" width="250" height="56" stroke="black" fill="white" stroke-width="2" stroke-dasharray="8,5"/>
<text x="165.0" y="252.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="16" text-anchor="middle" font-weight="bold">紧急呼叫</text>
<text x="165.0" y="276.0" font-family="Noto Sans CJK SC, sans-serif" fill="black" font-size="13" text-anchor="middle">可抢占正在进行的通话</text>
<line x1="290" y1="260" x2="330" y2="260" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
</svg>
